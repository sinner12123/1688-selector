<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
  <title>1688 选品助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛒</span>
      <span class="title">1688 选品助手</span>
      <span class="subtitle">跨境选品 · 浏览器自动化 · 不调用官方 API</span>
    </div>
    <div class="status">
      <span id="statusText" class="status-text">检测登录中…</span>
      <button id="proxyBtn" class="btn btn-outline">代理设置</button>
      <button id="loginBtn" class="btn btn-outline">扫码登录</button>
    </div>
  </header>

  <section class="search-panel">
    <div class="search-row">
      <input id="keyword" type="text" placeholder="输入选品关键词，例如：手机壳、宠物用品、香薰机…" />
      <button id="searchBtn" class="btn btn-primary">🔍 搜索</button>
      <button id="exportBtn" class="btn btn-outline">导出 CSV</button>
    </div>
    <div class="filter-row">
      <label>排序
        <select id="sort">
          <option value="relevance">综合</option>
          <option value="best-selling">销量优先</option>
          <option value="price-asc">价格从低到高</option>
          <option value="price-desc">价格从高到低</option>
        </select>
      </label>
      <label>数量
        <select id="max">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
      </label>
      <label>资质
        <select id="verified">
          <option value="any">不限</option>
          <option value="factory">工厂</option>
          <option value="business">贸易/商业</option>
          <option value="super-factory">超级工厂</option>
        </select>
      </label>
      <label>最低价 <input id="priceMin" type="number" min="0" placeholder="元" /></label>
      <label>最高价 <input id="priceMax" type="number" min="0" placeholder="元" /></label>
      <label class="checkbox"><input id="excludeAds" type="checkbox" /> 排除广告位</label>
      <label class="checkbox"><input id="profitToggle" type="checkbox" /> 利润分析</label>
      <label>汇率 ¥→$ <input id="fxRate" type="number" value="7.2" step="0.01" min="0" /></label>
    </div>
  </section>

  <main class="content">
    <div id="hint" class="hint">输入关键词，对比 1688（国内批发价）与 AliExpress / Amazon / eBay（海外零售价）。首次搜索需启动浏览器，约 20–60 秒。</div>
    <div id="loading" class="loading" hidden>正在搜索 1688，请稍候…</div>
    <div id="error" class="error" hidden></div>
    <div id="results" class="results"></div>
  </main>

  <div id="proxyModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <span>代理设置（海外采集走代理）</span>
        <button id="proxyClose" class="modal-close">✕</button>
      </div>
      <div class="modal-body proxy-body">
        <label class="proxy-row"><span>启用代理</span><input id="proxyEnabled" type="checkbox" /></label>
        <label class="proxy-row"><span>类型</span>
          <select id="proxyType"><option value="http">HTTP</option><option value="socks5">SOCKS5</option></select>
        </label>
        <label class="proxy-row"><span>地址</span><input id="proxyHost" type="text" placeholder="127.0.0.1" /></label>
        <label class="proxy-row"><span>端口</span><input id="proxyPort" type="number" placeholder="7890" /></label>
        <label class="proxy-row"><span>用户名</span><input id="proxyUser" type="text" placeholder="选填" /></label>
        <label class="proxy-row"><span>密码</span><input id="proxyPass" type="password" placeholder="选填" /></label>
        <p class="proxy-tip">示例：Clash 用 HTTP 127.0.0.1:7890；Shadowsocks 用 SOCKS5 127.0.0.1:1080。</p>
        <button id="proxySave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="loginModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <span>扫码登录 1688</span>
        <button id="modalClose" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-tip">用手机上的 <b>1688</b> 或 <b>淘宝</b> App 扫描下方二维码，并在手机上点「确认登录」。</p>
        <img id="qrImg" class="qr" alt="登录二维码" />
        <p id="loginState" class="login-state">等待二维码…</p>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
